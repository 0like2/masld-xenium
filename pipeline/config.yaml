# pipeline/config.yaml

# Xenium Pipeline Configuration
# ------------------------------------------------------------

# Input/Output Settings
# Local Mac path (for development):
# input_path: "/Users/iyeonglag/PycharmProjects/masld-xenium/data/Xenium_V1_FFPE_Human_Brain_Alzheimers_With_Addon_outs"
input_path: "/data/project/lyrak/masld-xenium/data/Xenium_V1_FFPE_Human_Brain_Alzheimers_With_Addon_outs"
input_advanced: "xenium-output/cellpose_output/segments_cellpose.tif"  # Example path
output_dir: "xenium-output"
sample_tag: "human_alzheimers"

baysor:
  enabled: true
  dry_run: false  # Set true to simulate Baysor execution (no actual run)
  executable_path: "/usr/local/bin/baysor" # Path to baysor binary; on server: adjust to actual installation path
  params:
    scale: 50
    min_molecules_per_cell: 10
    prior_segmentation_confidence: 0.8 # User requested value
    save_polygons: true

# Step 0: Formatting Parameters
formatting:
  mincounts: 10
  mingenes: 3
  filter_nuclei_only: false  # If true, keep only transcripts with overlaps_nucleus=1 (matches notebook 0_3)

# Step 1 (New): Exploration Parameters
exploration:
  # Ref: 1_7 uses radius=100 for structure scores
  neighbor_radius: 100.0
  run_transcript_dispersion: true
  resolutions: [0.5, 0.8, 1.0, 1.5]
  primary_resolution: 1.0

# Step 2 (New): Segmentation Free Analysis (Ref: Points2Regions etc.)
segmentation_free:
  run_points2regions: true
  run_ssam: false
  run_overlaps: false  # Changed default: ovrlpy not fully implemented
  distance_metric: "centroid"  # "centroid" (notebook default), "boundary", or "both"
  
  points2regions:
    sigma: 3.0
    n_clusters: [50, 100, 200, 500]
    bin_width: 1.0
    min_genes_per_bin: 15
    
  ssam:
    ssam_vf_um_per_px: 2.0
    kde_bandwidth_um: 2.5
    norm_thres: 5
    exp_thres: 0.2
    min_dist: 7
    
  overlaps:
    um_per_pixel: 2.0
    radius: 50.0
    bw: 1

# Step 3: Comparison (Metrics) - Now Executed as Step 4
comparison:
  run_efficiency: true
  run_specificity: true
  run_positivity: true  # New: Moved from Resegmentation
  run_diffusion: true   # New: Moved from Resegmentation
  technology: "xenium"  # For pixel-to-um conversion: xenium|cosmx|vizgen|merfish|hybriss|resolvedbio

  # Positivity analysis preprocessing (matching notebook 3_5 defaults)
  positivity:
    n_neighbors: 8        # Notebook default: 8
    n_pcs: 0              # Notebook default: 0 (no PCA, use expression directly)
    leiden_resolution: 2.2 # Notebook default: 2.2
    umap_min_dist: 0.1    # Notebook default: 0.1
    min_counts: 10        # Cell filtering: min transcripts per cell
    min_genes: 3          # Cell filtering: min genes per cell

  # Efficiency analysis: minimum reads per cell to count as expressing (notebook default: 1)
  efficiency_minreads: 1

  # Optional: Comparison with other datasets
  visium_path: null
  sc_reference_path: null # Path to scRNAseq reference .h5ad for Specificity (NMP) analysis

# Step 4: Resegmentation (Cellpose)
resegmentation:
  run_resegmentation: true
  expansion_distance: 400  # Pixels to expand nuclei masks (notebook default: 400). Set 0 to disable.
  um_per_pixel_inv: 4.70588  # Pixel-to-µm factor for cell area conversion (Xenium default)

  cellpose:
    # use_gpu: auto-detected (CUDA > MPS > CPU)
    model_type: 'nuclei'
    diameter: null # Auto-detect if null
    channels: [0, 0] # Grayscale

  # Domain Assignment Params (from Notebook 3.2 logic if implemented)
  domain_assignment:
    n_domains: 5
    domain_map_path: "figures/2.comparison_between_datasets/polygons/regions_multisection_1.json" # Path to domain polygons (JSON)

# Step 5: Optimal Expansion
optimal_expansion:
  run_expansion: true
  subsample_fraction: 0.01  # Fraction of assigned cells to use for KDTree speedup (Ref: 4_1 notebook)
  distance_threshold: null  # Optional max distance (null = assigning to nearest regardless of dist)
  min_reads_per_domain: 5000  # Min transcripts per domain to include in turnover analysis
  diff_threshold: 0.1  # Correlation diff threshold to detect turnover point

# Step 6: Benchmark Preprocessing (matches notebook defaults)
benchmark:
  preprocessing:
    target_sum: 100
    min_counts: 40
    min_genes: 15
    n_neighbors: 15
    n_pcs: 0  # 0 = use all PCs
    umap_min_dist: 0.1
    resolution: 1.0
    scale: false
    hvg: true  # HVG selection before PCA (notebook default: true, params: min_mean=0.3, max_mean=7, min_disp=-0.5)
  reference_adata: null  # Path to reference .h5ad for annotation transfer
  ref_celltype_key: "celltype"  # Column in reference adata for cell type labels
  sc_reference_path: null  # Path to scRNAseq reference .h5ad for NMP metrics (needs layers['raw'] + obs['celltype'])

# Step 7: Simulation & Preprocessing
simulation:
  run_simulation: true
  census_tissue: "brain" # Tissue to download from CellxGene Census
  census_organism: "mus_musculus"
  
  # Simulation Parameters
  n_markers: 200
  n_reads_per_gene: 40
  noise_percentage: 10.0 # %
  missegmentation_percentage: 10.0 # %
  
  # Dataset Filtering
  max_cells: 20000
  min_celltypes: 2
  max_celltypes: 30

  # Assessment Parameters
  n_permutations: 30 # Number of preprocessing combinations to test
  reference_key: "cell_type" # Column in scRNAseq to use as ground truth

  # Preprocessing Grid (expanded to ~50 combinations)
  preprocessing_grid:
    normalize: [true, false]
    target_sum: [100, 1000, 10000]
    scale: [true, false]
    hvg: [true, false]
    n_neighbors: [10, 15, 30]
    n_pcs: [15, 30, 50]
    resolution: [0.5, 1.0, 1.5]

# Step 2 (Original -> Deferred): Preprocessing Parameters
preprocessing:
  target_sum: 100
  neigh: 15
  scale: false
  hvg: false

# Step 2: Annotation Parameters (Original Step 2 - Deferred)
# (Params moved to exploration for the new flow)
annotation:
  # keeping empty or legacy params if any
  {}

# Execution Settings
use_parquet: true  # Use .parquet files if available (faster)
